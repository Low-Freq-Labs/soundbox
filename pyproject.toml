[project]
name = "soundbox"
version = "1.0.0"
description = "Native PySide6 bridge from the live rekordbox DB to Rockbox/iPod — curation, cover art, honest sync."
requires-python = ">=3.14"
# Real dependency set lives in requirements.txt (venv at .venv/);
# the soundbox/ engine package itself stays Qt-free.

[project.scripts]
soundbox = "soundbox.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
