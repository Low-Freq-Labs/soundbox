[mypy]
python_version = 3.14
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
check_untyped_defs = True
warn_return_any = True
# The engine must typecheck; the Qt layer is checked more loosely (PySide6
# stubs are incomplete) — still catches arg-order/None bugs in untyped defs.
[mypy-pyrekordbox.*]
ignore_missing_imports = True
[mypy-yt_dlp.*]
ignore_missing_imports = True
[mypy-soundfile]
ignore_missing_imports = True
