[package]
name = "soundbox-cdj-fixture-export"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
soundbox-cdj = { path = "../../../native/cdj" }
rbl-export = { path = "../../../native/cdj/vendor/rbxport/crates/rbl-export" }
rbl-onelibrary = { path = "../../../native/cdj/vendor/rbxport/crates/rbl-onelibrary" }
rbl-pdb = { path = "../../../native/cdj/vendor/rbxport/crates/rbl-pdb" }
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
