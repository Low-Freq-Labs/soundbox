[package]
name = "soundbox-cdj"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
exclude = ["vendor/rbxport", "vendor/rbxport/crates/*"]

[dependencies]
rbl-export = { path = "vendor/rbxport/crates/rbl-export" }
rbl-onelibrary = { path = "vendor/rbxport/crates/rbl-onelibrary" }
rbl-pdb = { path = "vendor/rbxport/crates/rbl-pdb" }
rbl-analysis = { path = "vendor/rbxport/crates/rbl-analysis" }
rbl-audio = { path = "vendor/rbxport/crates/rbl-audio" }
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"


[profile.release]
strip = "none"
